services:
  form_app:
    build:
      context: .
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Forms}
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    expose:
      - "3000"
    environment:
      PGHOST: form_db
      PGUSER: forms_app
      PGDATABASE: forms
      PGPASSWORD: ${FORMS_DB_PASSWORD:?Configura FORMS_DB_PASSWORD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Configura PUBLIC_ORIGIN}
      AUTH_URL: ${AUTH_URL:?Configura AUTH_URL}
      AUTH_APP_SLUG: ${AUTH_APP_SLUG:-forms}
      AUTH_ALLOWED_ROLES: ${AUTH_ALLOWED_ROLES:-docente,admin}
      FORMS_IMPORT_SECRET: ${FORMS_IMPORT_SECRET:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      form_db_setup:
        condition: service_completed_successfully
  form_db_setup:
    image: postgres:17-bookworm
    restart: "no"
    user: postgres
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/setup.sql"]
    environment:
      PGHOST: form_db
      PGDATABASE: forms
      PGUSER: forms
      PGPASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      FORMS_DB_PASSWORD: ${FORMS_DB_PASSWORD:?Configura FORMS_DB_PASSWORD}
    volumes:
      - ./docker/setup.sql:/setup.sql:ro
    depends_on:
      form_db:
        condition: service_healthy
  form_db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: forms
      POSTGRES_USER: forms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "forms", "-d", "forms"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  postgres:
  uploads:

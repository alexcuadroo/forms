name: Bug
description: Reportar un comportamiento incorrecto
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Qué pasó y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir...
        2. Hacer clic en...
        3. Ver el error...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
      description: Versión publicada, rama o hash del commit.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Navegador, sistema operativo, Node.js, PostgreSQL y método de despliegue.
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Pegá errores relevantes sin incluir secretos ni datos personales.
      render: text
